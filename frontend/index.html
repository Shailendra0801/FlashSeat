<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashSeat - Book Tickets Fast</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>FlashSeat</h1>
      <p>Book tickets for concerts, sports, and live events in seconds</p>
      <button class="btn btn-primary" id="showLoginBtn">Login</button>
      <button class="btn btn-outline" id="showRegisterBtn">Register</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Welcome Back</h2>
        <button class="modal-close" id="closeModalBtn" aria-label="Close">&times;</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <input type="email" id="login_email" placeholder="Email Address" required>
        <input type="password" id="login_password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden">
        <input type="text" id="full_name" placeholder="Full Name" required>
        <input type="email" id="register_email" placeholder="Email Address" required>
        <input type="password" id="register_password" placeholder="Password" required>
        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
