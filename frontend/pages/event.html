<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Map - FlashSeat</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(20, 50px);
      gap: 10px;
      max-width: 1100px;
      margin: 30px 0;
      justify-content: center;
    }
    .seat {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .seat.available { 
      background: #22c55e; 
      color: white; 
    }
    .seat.booked, .seat.sold { 
      background: #6b7280; 
      color: white; 
      cursor: not-allowed; 
    }
    .seat.blocked { 
      background: #f59e0b; 
      color: white; 
      cursor: not-allowed; 
    }
    .seat:hover.available {
      transform: scale(1.12);
      box-shadow: 0 6px 15px rgba(34, 197, 94, 0.4);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="goBack()" style="margin-bottom: 20px;">← Back to Dashboard</button>
    
    <h1 id="eventTitle">Loading Event...</h1>
    <p id="eventInfo"></p>

    <!-- Session Selector -->
    <div class="card session-selector">
      <label for="sessionSelect"><strong>Select Show / Session:</strong></label><br><br>
      <select id="sessionSelect" onchange="loadSeatMapForSession()" style="padding: 12px; font-size: 1.05rem; width: 100%; max-width: 550px;">
      </select>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div><span class="seat available" style="width:24px;height:24px;display:inline-block;"></span> Available</div>
      <div><span class="seat booked" style="width:24px;height:24px;display:inline-block;"></span> Booked / Sold</div>
      <div><span class="seat blocked" style="width:24px;height:24px;display:inline-block;"></span> Blocked</div>
    </div>

    <!-- Visual Seat Grid -->
    <div class="card">
      <h2>Venue Seat Map</h2>
      <p id="selectedSessionInfo" style="margin-bottom: 15px; font-weight: 500; color: #334155;"></p>
      <div id="seatMap" class="seat-grid"></div>
    </div>
  </div>

  <!-- Waiting Room Screen -->
  <div id="waitingRoom" class="waiting-room hidden">
      <div class="waiting-content">
          <h2>⏳ You are in the Waiting Room</h2>
          <p id="queueMessage">Please wait while we find a spot for you...</p>
          
          <div class="queue-position">
              <h1 id="queuePosition">45</h1>
              <p>Your Position</p>
          </div>

          <p id="estimatedWait">Estimated wait: ~2 minutes</p>
          
          <div class="loader"></div>
          <button onclick="goBack()" style="margin-top: 30px;">Leave Queue</button>
      </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="event.js"></script>
</body>
</html>
