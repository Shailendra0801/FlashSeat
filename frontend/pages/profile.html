<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - FlashSeat</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .order-card {
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .order-title {
      font-weight: 800;
      margin-bottom: 6px;
      color: #1e3a8a;
    }

    .order-meta {
      color: #64748b;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .seat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .seat-pill {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      color: #0f172a;
      font-size: 0.9rem;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      background: #e0e7ff;
      color: #3730a3;
    }

    .status-confirmed { background: #dcfce7; color: #166534; }
    .status-pending { background: #dbeafe; color: #1d4ed8; }
    .status-failed { background: #fee2e2; color: #991b1b; }

    .empty-state {
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      color: #475569;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <h2>FlashSeat</h2>
      <div class="header-right">
        <span id="userGreeting">Welcome</span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </header>

    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="dashboard.html">🌠 Dashboard</a></li>
          <li><a href="#">🎟️ Events</a></li>
          <li class="active"><a href="profile.html">📄 My Bookings</a></li>
          <li><a href="profile.html">👤 Profile</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <h1 style="margin-bottom: 18px;">Your Profile</h1>

      <section class="card">
        <h3 style="margin-bottom: 10px;">Order History</h3>
        <div id="ordersList">Loading orders...</div>
      </section>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
